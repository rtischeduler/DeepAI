<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>DeepAI</title>
<style>
:root {
  --bg: #0b0c10;
  --panel: #14161d;
  --line: #242732;
  --text: #e9eaf0;
  --muted: #8a8fa0;
  --accent: #8f37ff;
  --accent2: #a964ff;
  --bad: #ff5d6c;
}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#app {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--bg);
  opacity: 0;
  transition: opacity .25s ease;
}
#app.on { opacity: 1; }
#boot {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
  background: var(--bg);
  transition: opacity .25s ease;
}
#boot.off { opacity: 0; pointer-events: none; }
.spin {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#boot-status { color: var(--muted); font-size: 13.5px; max-width: 420px; overflow-wrap: anywhere; }
#boot.fail .spin { display: none; }
#boot.fail #boot-status { color: #ffc4ca; }
.actions { display: none; gap: 8px; }
#boot.fail .actions { display: flex; }
button {
  font: inherit;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 14px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent2); }
#toast {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 6;
  display: none;
  align-items: center;
  gap: 10px;
  max-width: calc(100vw - 24px);
  padding: 8px 12px;
  font-size: 13px;
  background: var(--panel);
  border: 1px solid var(--bad);
  border-radius: 12px;
}
#toast.show { display: flex; }
#toast button { padding: 4px 10px; }
</style>
</head>
<body>
<div id="boot">
  <div class="spin"></div>
  <div id="boot-status">Starting…</div>
  <div class="actions">
    <button id="retry" class="primary">Retry</button>
    <button id="switch">Switch proxy</button>
  </div>
</div>
<div id="toast">
  <span id="toast-text"></span>
  <button id="toast-switch">Switch proxy</button>
  <button id="toast-close" aria-label="Dismiss">✕</button>
</div>
<iframe id="app" title="DeepAI" allow="clipboard-read; clipboard-write; microphone; fullscreen"></iframe>

<script type="module">
const BAD_KEY = "WB_BAD";
const BAD_TTL_MS = 6 * 3600000;

function createBadList({ storage, now = () => Date.now(), ttl = BAD_TTL_MS, key = (entry) => String(entry) } = {}) {
  const box = () => {
    try { return storage || globalThis.localStorage || null; } catch { return null; }
  };
  const read = () => {
    const s = box();
    if (!s) return {};
    try {
      const v = JSON.parse(s.getItem(BAD_KEY));
      return v && typeof v === "object" && !Array.isArray(v) ? v : {};
    } catch { return {}; }
  };
  const live = () => {
    const t = now(), out = {};
    for (const [k, ts] of Object.entries(read())) if (typeof ts === "number" && t - ts < ttl) out[k] = ts;
    return out;
  };
  return {
    has: (entry) => Object.hasOwn(live(), key(entry)),
    add(entry) {
      const s = box();
      if (!s) return;
      const v = live();
      v[key(entry)] = now();
      try { s.setItem(BAD_KEY, JSON.stringify(v)); } catch {}
    },
    clear() {
      const s = box();
      try { if (s) s.removeItem(BAD_KEY); } catch {}
    },
  };
}

const KSTUFF = "lotsacookie/kstuff";
const STORAGE = "TongSherbet/storage";
const LIST_PATH = "Assets/json/wss.json";
const jsd = (repo) => [
  `https://cdn.jsdelivr.net/gh/${repo}@main/`,
  `https://fastly.jsdelivr.net/gh/${repo}@main/`,
  `https://gcore.jsdelivr.net/gh/${repo}@main/`,
];
const KSTUFF_MIRRORS = [...jsd(KSTUFF), `https://raw.githubusercontent.com/${KSTUFF}/main/`, `https://cdn.statically.io/gh/${KSTUFF}/main/`];
const STORAGE_MIRRORS = [...jsd(STORAGE), `https://raw.githubusercontent.com/${STORAGE}/main/`];
const BUILTIN = [
  "cdn.northstreetumc.org", "cdn.vipersfutbol.com", "cdn.pcesc.org", "cdn.kcchallengevbc.com",
  "cdn.slcbmooc.org", "cdn.topstargym.net", "cdn.goaplytexas.org", "cdn.clearfieldswimming.com",
  "wss://athollcottage.com/connection/", "wss://api.personalloanonline.net/ws/",
  "wss://kristenblackburnvolleyballcamps.com/socket/", "wss://southpadreislandkiteboarding.com/socket/",
];
const FALLBACK = "wss://api.personalloanonline.net/ws/";

const HOST_RE = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/i;
const WSS_RE = /^wss:\/\/[a-z0-9.-]+(:\d{1,5})?(\/[\w\-./]*)?$/i;
const isBackup = (e) => e.includes("://");
const toWss = (e) => {
  e = String(e || "").trim();
  if (!e) return null;
  const u = isBackup(e) ? e : `wss://${e}/`;
  return u.endsWith("/") ? u : u + "/";
};
const bad = createBadList({ key: toWss });
function decodeLoaderList(src, hostRe, wssRe, max, depth = 0) {
  if (depth > 3 || typeof src !== "string") return [];
  let code = null;
  try {
    const stub = new Proxy({}, { get: () => (a) => { if (code === null && typeof a === "string") code = a; } });
    new Function("globalThis", src)(stub);
  } catch {}
  if (!code) return [];
  const arrays = code.match(/\[(?:\s*"[^"\\]{3,120}"\s*,?)+\s*\]/g) || [];
  for (const arr of arrays) {
    let vals;
    try { vals = JSON.parse(arr.replace(/,\s*\]$/, "]")); } catch { continue; }
    const out = [];
    for (const v of vals) {
      const value = String(v).trim();
      if ((hostRe.test(value) || wssRe.test(value)) && !out.includes(value)) out.push(value);
      if (out.length >= max) break;
    }
    if (out.length >= 3 && out.length >= vals.length * 0.6) return out;
  }
  return decodeLoaderList(code, hostRe, wssRe, max, depth + 1);
}
function parseServerList(src, decode = (s) => decodeLoaderList(s, HOST_RE, WSS_RE, 32)) {
  if (typeof src !== "string") return [];
  const text = src.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
  const block = text.match(/serverList\s*=\s*\[([\s\S]*?)\]\s*[;,]/);
  if (!block) return decode(src);
  const item = /(["'])((?:\\.|(?!\1)[^\\])*)\1(\s*\.split\(\s*(?:""|'')\s*\)\s*\.reverse\(\)\s*\.join\(\s*(?:""|'')\s*\))?/g;
  const out = [];
  let m;
  while ((m = item.exec(block[1]))) {
    const value = (m[3] ? [...m[2]].reverse().join("") : m[2]).trim();
    if ((HOST_RE.test(value) || WSS_RE.test(value)) && !out.includes(value)) out.push(value);
    if (out.length >= 32) break;
  }
  return out;
}
function decodeInSandbox(src, ms = 4000) {
  return new Promise((resolve) => {
    const f = document.createElement("iframe");
    f.sandbox = "allow-scripts";
    f.style.display = "none";
    const done = (v) => { clearTimeout(t); removeEventListener("message", on); f.remove(); resolve(v); };
    const t = setTimeout(() => done([]), ms);
    const on = (e) => { if (e.source === f.contentWindow && e.data && e.data.wbDecoded) done(e.data.list || []); };
    addEventListener("message", on);
    f.srcdoc = `<script>const decode=${decodeLoaderList.toString()};` +
      `addEventListener("message",e=>{let l=[];try{l=decode(e.data.src,new RegExp(e.data.h,"i"),new RegExp(e.data.w,"i"),32)}catch{}` +
      `parent.postMessage({wbDecoded:1,list:l},"*")});parent.postMessage({wbReady:1},"*")<\/script>`;
    const ready = (e) => {
      if (e.source !== f.contentWindow || !e.data || !e.data.wbReady) return;
      removeEventListener("message", ready);
      f.contentWindow.postMessage({ src, h: HOST_RE.source, w: WSS_RE.source }, "*");
    };
    addEventListener("message", ready);
    document.body.append(f);
  });
}
const parseInBrowser = async (src) => parseServerList(src, (s) => decodeInSandbox(s));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
async function fetchWith(url, type, ms = 4000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store", signal: c.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r[type]();
  } finally { clearTimeout(t); }
}
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const b64ToText = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.trim()), (c) => c.charCodeAt(0)));
function parseWispList(json) {
  const b64 = Array.isArray(json) ? json.find((v) => typeof v === "string" && v.trim()) : json;
  if (typeof b64 !== "string") return [];
  let data;
  try { data = JSON.parse(b64ToText(b64)); } catch { return []; }
  const out = [];
  (function walk(v) {
    if (typeof v === "string" && /^wss:\/\//i.test(v.trim())) out.push(v.trim());
    else if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === "object") Object.values(v).forEach(walk);
  })(data);
  return [...new Set(out)];
}
async function fetchWispList(mirrors = KSTUFF_MIRRORS) {
  try { return parseWispList(await Promise.any(mirrors.map((m) => fetchWith(m + LIST_PATH, "json", 5000)))); }
  catch { return []; }
}
async function syncStorageList(mirrors = STORAGE_MIRRORS) {
  const cached = store.get("WB_SYNC");
  const cachedList = cached && Array.isArray(cached.list) ? cached.list.filter((u) => HOST_RE.test(u) || WSS_RE.test(u)) : [];
  if (cachedList.length && Date.now() - (cached.ts || 0) < 3600000) return cachedList;
  const failed = store.get("WB_SYNCF");
  if (failed && Date.now() - (failed.ts || 0) < 600000) return cachedList;
  for (const m of mirrors) {
    try {
      const list = await parseInBrowser(await fetchWith(m + "loader.js", "text", 3500));
      if (!list.length) throw new Error("no servers in loader.js");
      store.set("WB_SYNC", { ts: Date.now(), list });
      return list;
    } catch (e) { console.warn("[wisp] storage sync failed:", m, e && e.message || e); }
  }
  store.set("WB_SYNCF", { ts: Date.now() });
  return cachedList;
}
function probeWisp(entry, timeoutMs = 3000) {
  return new Promise((resolve) => {
    let ws;
    try { ws = new WebSocket(toWss(entry)); } catch { return resolve(null); }
    ws.binaryType = "arraybuffer";
    let connected = false, sentAt = 0;
    const streamId = (Math.floor(Math.random() * 0xFFFFFFFE) + 1) >>> 0;
    const finish = (ping) => { clearTimeout(timer); ws.onmessage = ws.onerror = ws.onclose = null; try { ws.close(); } catch {} resolve(ping); };
    const timer = setTimeout(() => finish(null), timeoutMs);
    ws.onmessage = (e) => {
      if (!(e.data instanceof ArrayBuffer) || e.data.byteLength < 5) return;
      const v = new DataView(e.data), type = v.getUint8(0), stream = v.getUint32(1, true);
      if (!connected) {
        if (type === 5 && stream === 0) ws.send(new Uint8Array([5, 0, 0, 0, 0, 2, 1]));
        else if (type === 3 && stream === 0) {
          connected = true;
          const host = new TextEncoder().encode("127.0.0.1");
          const buf = new ArrayBuffer(8 + host.length), dv = new DataView(buf);
          dv.setUint8(0, 1); dv.setUint32(1, streamId, true); dv.setUint8(5, 1); dv.setUint16(6, 69, true);
          new Uint8Array(buf).set(host, 8);
          sentAt = performance.now();
          ws.send(buf);
        }
        return;
      }
      if (stream === streamId) finish(Math.round(performance.now() - sentAt));
    };
    ws.onerror = ws.onclose = () => finish(null);
  });
}

async function firstAlive(entries, say, label, waveSize = 6) {
  const alive = [];
  for (let i = 0; i < entries.length && !alive.length; i += waveSize) {
    const wave = entries.slice(i, i + waveSize);
    say(`${label} (${Math.min(i + waveSize, entries.length)}/${entries.length})…`);
    const pings = await Promise.all(wave.map((e) => probeWisp(e)));
    wave.forEach((e, j) => { if (pings[j] !== null) alive.push({ entry: e, ping: pings[j] }); });
  }
  return alive.sort((a, b) => a.ping - b.ping)[0] || null;
}
function provisionalWisp(network) {
  const last = store.get("WB_LAST");
  const url = toWss(last && last.entry && !bad.has(last.entry) ? last.entry : FALLBACK);
  network.set_websocket(url);
  return url;
}
async function pickWisp(network, say = () => {}, opts = {}) {
  const budgetMs = opts.budgetMs || 15000;
  const excluded = new Set((opts.exclude || []).map(toWss));
  const allowed = (entry) => !excluded.has(toWss(entry));
  const prefer = (list) => {
    const ok = list.filter(allowed);
    return [...ok.filter((e) => !bad.has(e)), ...ok.filter((e) => bad.has(e))];
  };
  const apply = (entry) => {
    const url = toWss(entry);
    network.set_websocket(url);
    try { network.set_wisp_pool([url]); } catch {}
    store.set("WB_LAST", { entry, ts: Date.now() });
    return url;
  };
  const search = async () => {
    const last = store.get("WB_LAST");
    if (last && last.entry && allowed(last.entry) && !bad.has(last.entry) && Date.now() - last.ts < 600000 && (await probeWisp(last.entry)) !== null) return apply(last.entry);

    say("Syncing wisp list…");
    const synced = await syncStorageList(opts.storageBases ? [...opts.storageBases, ...STORAGE_MIRRORS.filter((m) => !opts.storageBases.includes(m))] : STORAGE_MIRRORS);
    const all = prefer([...new Set([...synced, ...BUILTIN])]);
    const primary = all.filter((e) => !isBackup(e));
    const hit = await firstAlive(primary, say, "Testing wisp servers");
    if (hit) return apply(hit.entry);

    say("Trying backup wisps…");
    const remote = await fetchWispList(opts.kstuffBases ? [...opts.kstuffBases, ...KSTUFF_MIRRORS.filter((m) => !opts.kstuffBases.includes(m))] : KSTUFF_MIRRORS);
    const backups = prefer([...new Set([...all.filter(isBackup), FALLBACK, ...shuffle(remote.filter((u) => !all.includes(u))).slice(0, 16)])]);
    const bhit = await firstAlive(backups, say, "Testing backup wisps");
    if (bhit) return apply(bhit.entry);
    return null;
  };
  const timeout = new Promise((r) => setTimeout(() => r(null), budgetMs));
  try {
    const url = await Promise.race([search(), timeout]);
    if (url) return url;
  } catch (e) { console.warn("[wisp] pick failed", e); }
  console.warn("[wisp] no wisp validated, using fallback");
  return apply([FALLBACK, ...BUILTIN.filter(isBackup)].find(allowed) || FALLBACK);
}

const DIST = "dist/sandstone.mjs";
const BASES = [
  "https://cdn.jsdelivr.net/gh/lotsacookie/Singuloxy@main/",
  "https://fastly.jsdelivr.net/gh/lotsacookie/Singuloxy@main/",
];

const withTimeout = (p, ms, label) => { let t; return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(new Error(label + " timed out")), ms); })]).finally(() => clearTimeout(t)); };

async function loadSandstone(log) {
  try { return await Promise.any(BASES.map((b) => withTimeout(import(b + DIST), 12000, "proxy script"))); }
  catch { log("[proxy] CDN import failed, trying GitHub raw"); }
  const r = await withTimeout(fetch("https://raw.githubusercontent.com/lotsacookie/Singuloxy/main/" + DIST), 12000, "GitHub raw");
  const code = await r.text();
  return import(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
}

let ready = null, state = null, rotating = null;
async function verifyWisp(libcurl) {
  const t0 = performance.now();
  const r = await withTimeout(libcurl.fetch("https://api.deepai.org/static/manifest.json", { method: "GET", redirect: "manual" }), 10000, "proxy check");
  await withTimeout(r.text(), 8000, "proxy check");
  return Math.round(performance.now() - t0);
}
async function connectWisp(st, say, log) {
  for (let i = 0; i < 4; i++) {
    const wisp = await pickWisp(st.network, say, { exclude: st.tried, budgetMs: 12000 });
    say("Checking proxy…");
    try { const ms = await verifyWisp(st.libcurl); log("[proxy] wisp", String(wisp), ms + "ms"); st.wisp = String(wisp); return; }
    catch (e) { log("[proxy] wisp failed check", String(wisp), (e && e.message) || e); bad.add(wisp); st.tried.push(wisp); }
  }
  throw new Error("No working proxy found. Reload to try again.");
}
function getProxy({ log = () => {}, say = () => {} } = {}) {
  return (ready ||= (async () => {
    const t0 = Date.now(), say2 = (t) => say(t + " (" + Math.round((Date.now() - t0) / 1000) + "s)");
    say2("Loading proxy…");
    const sandstone = await loadSandstone(log);
    provisionalWisp(sandstone.network);
    for (let i = 0; i < 150 && !sandstone.libcurl.ready; i++) await new Promise((r) => setTimeout(r, 100));
    if (!sandstone.libcurl.ready) throw new Error("libcurl did not load");
    state = { libcurl: sandstone.libcurl, network: sandstone.network, wisp: "", tried: [] };
    await connectWisp(state, say2, log);
    return state;
  })().catch((e) => { ready = null; throw e; }));
}
async function rotateProxy(log = () => {}, say = () => {}) {
  if (!state) return getProxy({ log, say });
  if (rotating) return rotating;
  rotating = (async () => {
    log("[proxy] switching wisp");
    if (state.wisp) { bad.add(state.wisp); state.tried.push(state.wisp); }
    if (state.tried.length > 6) state.tried.length = 0;
    await connectWisp(state, say, log);
    return state;
  })().finally(() => { rotating = null; });
  return rotating;
}
window.__getProxy = getProxy;
window.__rotateProxy = rotateProxy;

const $ = (id) => document.getElementById(id);
const el = {

let jar = (() => {

  return Array.isArray(v) ? v.filter((c) => c && c.name && c.domain) : [];
})();
const saveJar = () => store.set(JAR_KEY, jar);

function cookieFor(url) {
  const host = new URL(url).hostname;
  return jar.filter((c) => host === c.domain || host.endsWith("." + c.domain)).map((c) => c.name + "=" + c.value).join("; ");
}

function setCookieLines(r) {
  const out = [];
  if (Array.isArray(r.raw_headers)) {
    for (const [k, v] of r.raw_headers) if (/^set-cookie$/i.test(k)) out.push(v);
  }
  if (!out.length && r.headers) {
    if (typeof r.headers.getSetCookie === "function") out.push(...r.headers.getSetCookie());
    if (!out.length && typeof r.headers.get === "function") {
      const v = r.headers.get("set-cookie");
      if (v) out.push(...v.split(/,(?=\s*[^;,=\s]+=)/));
    }
  }
  return out;
}

function absorb(url, r) {
  const lines = setCookieLines(r);
  if (!lines.length) return;
  const host = new URL(url).hostname;
  for (const line of lines) {
    const parts = line.split(";").map((p) => p.trim());
    const eq = parts[0].indexOf("=");
    if (eq < 1) continue;
    const name = parts[0].slice(0, eq), value = parts[0].slice(eq + 1);
    let domain = host, expired = false;
    for (const p of parts.slice(1)) {
      const i = p.indexOf("=");
      const k = (i < 0 ? p : p.slice(0, i)).toLowerCase(), v = i < 0 ? "" : p.slice(i + 1);
      if (k === "domain" && v) domain = v.replace(/^\./, "").toLowerCase();
      if (k === "max-age" && Number(v) <= 0) expired = true;
      if (k === "expires" && Date.parse(v) < Date.now()) expired = true;
    }
    const idx = jar.findIndex((c) => c.name === name && c.domain === domain);
    if (idx >= 0) jar.splice(idx, 1);
    if (!expired && value) jar.push({ name, value, domain });
  }
  saveJar();
}

let toastTimer = 0;
function toast(text) {
  el.toastText.textContent = text;
  el.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove("show"), 12000);
}

const isRead = (m) => /^(GET|HEAD)$/i.test(m);

function toBody(b) {
  if (b == null || typeof b === "string") return b;
  const src = ArrayBuffer.isView(b) ? new Uint8Array(b.buffer, b.byteOffset, b.byteLength) : new Uint8Array(b);
  const out = new Uint8Array(src.byteLength);
  out.set(src);
  return out;
}

async function px(req) {
  const u = new URL(req.url, SITE + "/");
  if (!/^https?:$/.test(u.protocol)) throw new TypeError("Unsupported URL " + req.url);
  if (BLOCK_RE.test(u.hostname)) return new Response(null, { status: 204 });
  const method = String(req.method || "GET").toUpperCase();
  const once = async () => {
    const { libcurl } = await getProxy({ log, say });
    const headers = { ...(req.headers || {}) };
    if (OWN_RE.test(u.hostname)) {
      headers["User-Agent"] = navigator.userAgent;
      headers.Origin = SITE;
      headers.Referer = SITE + "/chat";
      const ck = cookieFor(u.href);
      if (ck) headers.Cookie = ck;
    }
    const init = { method, headers, redirect: "follow" };
    if (req.body != null && !isRead(method)) init.body = toBody(req.body);
    if (req.signal) {
      const ctl = new AbortController();
      if (req.signal.aborted) ctl.abort();
      else req.signal.addEventListener("abort", () => ctl.abort(), { once: true });
      init.signal = ctl.signal;
    }
    const r = await withTimeout(libcurl.fetch(u.href, init), isRead(method) ? 45000 : 120000, "Request");
    absorb(u.href, r);
    return r;
  };
  try {
    return await once();
  } catch (e) {
    const m = String((e && e.message) || e);
    if (req.signal && req.signal.aborted) throw e;
    const net = /error code (6|7|28|35|52|55|56)\b|timed out|websocket|wisp/i.test(m);
    const safe = isRead(method) || /error code (6|7|35)\b/.test(m);
    if (net && safe) {
      log("[proxy] request failed (" + m + "), switching proxy and retrying once");
      try {
        await rotateProxy(log, say);
        return await once();
      } catch (e2) {
        toast("Proxy connection failed.");
        throw e2;
      }
    }
    if (net) toast("Proxy connection failed.");
    throw e;
  }
}
window.__px = px;

function shim() {
  const SITE = "https://deepai.org";
  const own = (u) => {
    try { return /(^|\.)deepai\.org$/i.test(new URL(u, SITE + "/").hostname); } catch { return false; }
  };
  const aborted = () => new DOMException("The operation was aborted.", "AbortError");
  const reads = /^(GET|HEAD)$/;
  window.__pxShim = true;

  const encode = async (body, headers) => {
    if (body == null) return undefined;
    if (typeof body === "string") {
      if (!headers["content-type"]) headers["content-type"] = "text/plain;charset=UTF-8";
      return body;
    }
    const r = new Response(body);
    const type = r.headers.get("content-type");
    if (type && (!headers["content-type"] || body instanceof FormData)) headers["content-type"] = type;
    return new Uint8Array(await r.arrayBuffer());
  };

  const follow = (res, signal) => {
    if (!res.body || [101, 204, 205, 304].includes(res.status)) return res;
    const reader = res.body.getReader();
    let done = false;
    const stream = new ReadableStream({
      start(c) {
        signal.addEventListener("abort", () => {
          if (done) return;
          done = true;
          try { reader.cancel(); } catch {}
          try { c.error(aborted()); } catch {}
        }, { once: true });
      },
      async pull(c) {
        if (done) return;
        try {
          const { value, done: end } = await reader.read();
          if (end) { done = true; c.close(); } else c.enqueue(value);
        } catch (e) {
          if (!done) { done = true; c.error(e); }
        }
      },
      cancel() {
        done = true;
        try { reader.cancel(); } catch {}
      },
    });
    const out = new Response(stream, { status: res.status, statusText: res.statusText, headers: res.headers });
    try { Object.defineProperty(out, "url", { value: res.url }); } catch {}
    return out;
  };

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const raw = typeof input === "string" ? input : input && input.url ? input.url : String(input);
    if (/^(blob|data):/i.test(raw)) return realFetch(input, init);
    let method = "GET", body, signal;
    const headers = {};
    if (typeof Request !== "undefined" && input instanceof Request) {
      method = input.method;
      input.headers.forEach((v, k) => { headers[k.toLowerCase()] = v; });
      signal = input.signal;
      if (!reads.test(method)) body = await input.clone().arrayBuffer();
    }
    if (init) {
      if (init.method) method = String(init.method).toUpperCase();
      if (init.headers) new Headers(init.headers).forEach((v, k) => { headers[k.toLowerCase()] = v; });
      if ("body" in init) body = init.body;
      if (init.signal) signal = init.signal;
    }
    if (signal && signal.aborted) throw aborted();
    const url = new URL(raw, SITE + "/").href;
    const payload = reads.test(method) ? undefined : await encode(body, headers);
    const call = parent.__px({ url, method, headers, body: payload, signal });
    if (!signal) return call;
    const res = await Promise.race([
      call,
      new Promise((_, reject) => signal.addEventListener("abort", () => reject(aborted()), { once: true })),
    ]);
    return follow(res, signal);
  };

  const seen = new WeakMap();
  const fixImage = (img) => {
    if (!img || img.tagName !== "IMG") return;
    const src = img.getAttribute("src");
    if (!src || /^(data|blob):/i.test(src) || !own(src) || seen.get(img) === src) return;
    seen.set(img, src);
    const url = new URL(src, SITE + "/").href;
    parent.__px({ url, method: "GET", headers: { accept: "image/avif,image/webp,image/apng,image/*,*/*;q=0.8" } })
      .then((r) => (r.ok ? r.blob() : Promise.reject(new Error("HTTP " + r.status))))
      .then((b) => {
        const typed = !b.type && /\.svg(\?|$)/i.test(url) ? new Blob([b], { type: "image/svg+xml" }) : b;
        img.src = URL.createObjectURL(typed);
      })
      .catch(() => {});
  };
  const scan = (node) => {
    if (!node || node.nodeType !== 1) return;
    fixImage(node);
    if (node.querySelectorAll) node.querySelectorAll("img[src]").forEach(fixImage);
  };
  new MutationObserver((list) => {
    for (const m of list) {
      if (m.type === "attributes") fixImage(m.target);
      else m.addedNodes.forEach(scan);
    }
  }).observe(document, { subtree: true, childList: true, attributes: true, attributeFilter: ["src"] });

  for (const k of ["pushState", "replaceState"]) {
    const original = history[k].bind(history);
    history[k] = (s, t, u) => {
      try { return original(s, t, u); } catch {
        try { return original(s, t); } catch {}
      }
    };
  }

  navigator.sendBeacon = () => true;

  const srcDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, "src");
  if (srcDesc && srcDesc.set) {
    Object.defineProperty(HTMLScriptElement.prototype, "src", {
      configurable: true,
      enumerable: srcDesc.enumerable,
      get: srcDesc.get,
      set(v) {
        if (own(v)) srcDesc.set.call(this, v);
        else this.type = "text/blocked";
      },
    });
  }
  const setAttr = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (n, v) {
    if (this.tagName === "SCRIPT" && String(n).toLowerCase() === "src" && !own(v)) {
      this.type = "text/blocked";
      return;
    }
    return setAttr.call(this, n, v);
  };

  document.addEventListener("click", (e) => {
    const a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a) return;
    const raw = a.getAttribute("href");
    if (!raw || raw[0] === "#" || /^(javascript|blob|data|mailto):/i.test(raw) || a.hasAttribute("download")) return;
    let u;
    try { u = new URL(raw, SITE + "/"); } catch { return; }
    if (own(u.href)) { e.preventDefault(); return; }
    if (a.target === "_blank") return;
    e.preventDefault();
  }, true);

  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("img[src]").forEach(fixImage);
    parent.__pxReady();
  });
}

async function fetchText(url, ms = 60000) {
  const r = await px({ url, method: "GET", headers: { accept: url === SITE + "/chat" ? PAGE_ACCEPT : "*/*" } });
  if (!r.ok) throw new Error("HTTP " + r.status + " for " + new URL(url).pathname);
  return withTimeout(r.text(), ms, "Response");
}

async function buildDocument() {
  say("Loading DeepAI…");
  let html = await fetchText(SITE + "/chat");
  if (!/<head[\s>]/i.test(html) || !/chatMain/.test(html)) throw new Error("DeepAI returned an unexpected page");
  const tags = [...html.matchAll(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>\s*<\/script>/gi)];
  say("Loading scripts…");
  const swaps = await Promise.all(tags.map(async (m) => {
    if (/type\s*=\s*["']module/i.test(m[0])) return [m[0], m[0]];
    let abs = "";
    try { abs = new URL(m[1], SITE + "/").href; } catch {}
    if (!abs || !OWN_RE.test(new URL(abs).hostname)) return [m[0], ""];
    try {
      const code = await fetchText(abs);
      return [m[0], "<script>" + code.replace(/<\/script/gi, "<\\/script") + "<\/script>"];
    } catch (e) {
      log("[load] script failed", abs, (e && e.message) || e);
      return [m[0], ""];
    }
  }));
  for (const [from, to] of swaps) html = html.replace(from, () => to);
  html = html
    .replace(/window\.location\.hostname\s*===\s*["']deepai\.org["']/g, "true")
    .replace(/window\.top\.location\.href\s*=\s*window\.location\.href/g, "void 0")
    .replace(/function applyStoredLanguage\(\)\s*\{/, (m) => m + "return false;");
  html = html.replace(/<head[^>]*>/i, (h) => h + '<base href="' + SITE + '/"><script>(' + shim.toString() + ")();<\/script>");
  html = html.replace(/<\/head>/i, () => '<style id="px-style">' + RESTYLE + "</style></head>");
  return html;
}

let pageReady = false, mounting = false;

window.__pxReady = () => {
  pageReady = true;
  el.boot.classList.add("off");
  el.frame.classList.add("on");
};

function bootFail(e) {
  el.boot.classList.remove("off");
  el.boot.classList.add("fail");
  say("Could not load DeepAI: " + ((e && e.message) || e));
}

async function mount() {
  if (mounting) return;
  mounting = true;
  pageReady = false;
  el.boot.classList.remove("off", "fail");
  el.frame.classList.remove("on");
  try {
    el.frame.srcdoc = await buildDocument();
  } catch (e) {
    log("[mount] failed", e);
    bootFail(e);
  } finally {
    mounting = false;
  }
}

el.frame.addEventListener("load", () => {
  let ours = false;
  try { ours = Boolean(el.frame.contentWindow.__pxShim); } catch {}
  if (ours) {
    window.__pxReady();
    return;
  }
  if (pageReady) mount();
});

el.retry.addEventListener("click", () => mount());
el.swap.addEventListener("click", async () => {
  el.boot.classList.remove("fail");
  say("Switching proxy…");
  try { await rotateProxy(log, say); } catch {}
  mount();
});
el.toastSwitch.addEventListener("click", async () => {
  el.toast.classList.remove("show");
  try { await rotateProxy(log, say); } catch {}
});
el.toastClose.addEventListener("click", () => el.toast.classList.remove("show"));

try {
  document.cookie = "deepai_privacy_prefs=" + encodeURIComponent(JSON.stringify({ analytics: false, advertising: false, marketing: false })) + "; path=/; max-age=31536000";
} catch {}

mount();
</script>
</body>
